
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FriendlyEats{% endblock %}</title>
    <meta
        name="description"
        content="Descubre y administra restaurantes con FriendlyEats."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/styles.css') }}"
    >

    <script
        src="{{ url_for('static', path='/js/app.js') }}"
        defer
    ></script>
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">F.</span>
            <span>FriendlyEats</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
            <a href="/">Restaurantes</a>
            <a class="button button-small" href="/restaurants/new">
                + Agregar restaurante
            </a>
        </nav>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>FriendlyEats · Descubre tu próximo lugar favorito.</p>
    </footer>
</body>
</html>
